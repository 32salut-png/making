<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ちいさな工場：開拓編</title>
<style>
:root{--bg:#0e171e;--panel:#172630;--panel2:#203744;--line:#355565;--text:#edf5f5;--muted:#9bb2bb;--gold:#f3bd4d;--green:#73d39a;--red:#ee7b70;--blue:#6db9df}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#2b5062,#0e171e 57%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
header{min-height:70px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;background:#101d26eF;border-bottom:1px solid #2e4a59;position:sticky;top:0;z-index:3}
h1{font-size:20px;margin:0;letter-spacing:.08em}h1 span{color:var(--gold)}.stats{display:flex;gap:18px;color:var(--muted);font-size:12px}.stats b{font-size:17px;color:var(--text);margin-left:4px}.green{color:var(--green)!important}.gold{color:var(--gold)!important}
main{max-width:1400px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:230px minmax(520px,1fr) 285px;gap:16px}.panel{background:linear-gradient(145deg,#1b303c,#15232c);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 28px #0004;overflow:hidden}.panel h2{margin:0;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px;color:#b9cbd0;letter-spacing:.13em;text-transform:uppercase}
.tool{width:100%;padding:11px 13px;border:0;border-bottom:1px solid #294652;background:transparent;color:var(--text);display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer}.tool:hover{background:#294552}.tool.active{background:#604d27;box-shadow:inset 4px 0 var(--gold)}.tool.locked{opacity:.42}.tool .i{font-size:21px;width:25px;text-align:center}.tool small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.hint{padding:13px;color:var(--muted);font-size:11px;line-height:1.65}.hint b{color:var(--text)}
.game-head{height:42px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.game-head kbd{border:1px solid #4d6976;border-radius:4px;padding:3px 6px;color:var(--text)}canvas{display:block;width:100%;background:#16262d;border-top:1px solid var(--line);cursor:crosshair}.toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);padding:9px 16px;border:1px solid #63808a;border-radius:7px;background:#10232b;box-shadow:0 7px 22px #0009;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;font-size:12px}.toast.show{opacity:1}.game-wrap{position:relative}
.mission{padding:13px;background:#172832;border-bottom:1px solid #2e4a56}.mission .title{display:flex;justify-content:space-between;font-weight:700;font-size:13px}.mission p{margin:5px 0 8px;color:var(--muted);font-size:11px;line-height:1.45}.bar{height:7px;background:#0d171c;border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));transition:.3s}.mission .count{display:block;color:var(--muted);font-size:10px;margin-top:4px;text-align:right}.mission.done{border-left:3px solid var(--green)}.mission.done .title{color:var(--green)}
.resources{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:12px}.resource{padding:8px;border:1px solid #2e4a56;border-radius:7px;background:#13212a}.resource label{display:block;color:var(--muted);font-size:10px}.resource b{display:block;font-size:20px;margin-top:2px}.ore{color:#d9a875}.plate{color:#d7e0e0}.gear{color:var(--gold)}.coal{color:#b4a9d2}
.notice{margin:0 12px 12px;padding:10px;border-radius:7px;background:#13212a;color:var(--muted);font-size:11px;line-height:1.5}.notice b{color:var(--text)}.log{height:130px;overflow:auto;padding:10px 13px;border-top:1px solid var(--line);color:#a7bac0;font-size:10px;line-height:1.65}.log div:before{content:"› ";color:var(--gold)}
.research{padding:10px 12px;display:grid;gap:7px}.research button{border:1px solid #416070;border-radius:6px;padding:8px;background:#203744;color:var(--text);font-size:11px;text-align:left;cursor:pointer}.research button:hover{background:#2c4b59}.research button:disabled{opacity:.45;cursor:not-allowed}.research small{display:block;color:var(--muted);margin-top:3px}
@media(max-width:1050px){main{grid-template-columns:205px minmax(450px,1fr)}main>.panel:last-child{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1fr}.log{height:115px}}@media(max-width:700px){header{align-items:flex-start;gap:8px;flex-direction:column}.stats{gap:9px}main{display:block;padding:0 8px;margin:8px auto}.panel{margin-bottom:9px}.game-head{font-size:10px}.panel:first-child{display:grid;grid-template-columns:1fr 1fr}.panel:first-child h2,.hint{grid-column:1/-1}}
</style>
</head>
<body>
<header><h1>ちいさな<span>工場</span> <small style="font-size:11px;color:#9bb2bb">開拓編</small></h1><div class="stats"><span>資金<b class="green" id="money">180</b></span><span>電力<b id="power">0 / 10</b></span><span>日数<b id="day">1</b></span></div></header>
<main>
<section class="panel"><h2>建設</h2>
<button class="tool active" data-tool="select"><span class="i">🖐</span><span>選択<small>設備の情報を見る</small></span></button>
<button class="tool" data-tool="miner"><span class="i">⛏</span><span>採掘機　$35<small>鉄鉱石を採掘</small></span></button>
<button class="tool" data-tool="solar"><span class="i">☀️</span><span>発電機　$35<small>電力 +4</small></span></button>
<button class="tool" data-tool="belt"><span class="i">➜</span><span>ベルト　$8<small>資源を運ぶ</small></span></button>
<button class="tool locked" data-tool="furnace"><span class="i">🔥</span><span>溶鉱炉　$55<small>鉄鉱石 → 鉄板</small></span></button>
<button class="tool locked" data-tool="assembler"><span class="i">⚙️</span><span>組立機　$85<small>鉄板 → 歯車</small></span></button>
<button class="tool locked" data-tool="market"><span class="i">🏪</span><span>出荷所　$65<small>歯車を出荷</small></span></button>
<div class="hint"><b>まずやること</b><br>① 発電機を1台置く<br>② 採掘機を置く<br>③ 画面右のミッションを達成する<br><br><b>配置のコツ</b><br>設備は隣り合わせにすると資源を渡します。右クリックで撤去できます。</div></section>
<section class="panel game-wrap"><div class="game-head"><span id="mode">選択モード</span><span><kbd>左クリック</kbd> 建設　<kbd>右クリック</kbd> 撤去</span></div><canvas id="game" width="768" height="528"></canvas><div class="toast" id="toast"></div></section>
<section class="panel"><h2>現在のミッション</h2><div id="missions"></div><h2>在庫</h2><div class="resources"><div class="resource"><label>鉄鉱石</label><b class="ore" id="ore">0</b></div><div class="resource"><label>鉄板</label><b class="plate" id="plate">0</b></div><div class="resource"><label>歯車</label><b class="gear" id="gear">0</b></div><div class="resource"><label>石炭</label><b class="coal" id="coal">0</b></div></div><div class="notice" id="notice"><b>操業準備</b><br>発電機を置くと工場が動き始めます。</div><h2>研究</h2><div class="research"><button id="r1">製鉄技術　$80<small>溶鉱炉を解禁</small></button><button id="r2" disabled>自動組立　$160<small>組立機を解禁</small></button><button id="r3" disabled>出荷契約　$260<small>出荷所を解禁</small></button></div><h2>ログ</h2><div class="log" id="log"></div></section>
</main>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),C=48,cols=16,rows=11,W=768,H=528,$=id=>document.getElementById(id);
const typeNames={miner:"採掘機",solar:"発電機",belt:"ベルト",furnace:"溶鉱炉",assembler:"組立機",market:"出荷所"},price={miner:35,solar:35,belt:8,furnace:55,assembler:85,market:65},icon={miner:"⛏",solar:"☀",belt:"➜",furnace:"🔥",assembler:"⚙",market:"🏪"},color={miner:"#4f8d8d",solar:"#b98c3f",belt:"#527586",furnace:"#ae654d",assembler:"#9872a5",market:"#4d9d75"};
let tool="select",money=180,power=0,ore=0,plate=0,gear=0,coal=0,day=1,sec=0,buildings=[],particles=[],last=performance.now(),acc=0,research=0;
const missions=[{id:"start",title:"工場を始動する",desc:"発電機を1台、採掘機を1台配置する",need:()=>Math.min(1,buildings.filter(b=>b.type==="solar").length)+Math.min(1,buildings.filter(b=>b.type==="miner").length),max:2,reward:50},{id:"ore",title:"最初の資源",desc:"鉄鉱石を10個採掘する",need:()=>ore+plate+gear*2,max:10,reward:70},{id:"research",title:"製鉄技術を研究する",desc:"右側の研究ボタンから製鉄技術を購入する",need:()=>research>=1?1:0,max:1,reward:100},{id:"gear",title:"自動化ライン",desc:"歯車を5個生産する",need:()=>gear,max:5,reward:150},{id:"ship",title:"最初の出荷",desc:"出荷所を建設し、歯車を10個出荷する",need:()=>sold,max:10,reward:250}];let finished=new Set,sold=0;
function log(s){let e=document.createElement("div");e.textContent=s;$("log").prepend(e);while($("log").children.length>14)$("log").lastChild.remove()}
function toast(s){let e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1500)}
function cell(e){let r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*canvas.width/r.width/C),y:Math.floor((e.clientY-r.top)*canvas.height/r.height/C)}}
function at(x,y){return buildings.find(b=>b.x===x&&b.y===y)}function near(b,t){return buildings.some(n=>n.type===t&&Math.abs(n.x-b.x)+Math.abs(n.y-b.y)===1)}
function setTool(t){tool=t;document.querySelectorAll(".tool").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));$("mode").textContent=t==="select"?"選択モード":`${typeNames[t]}を配置中`}
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>{if(b.classList.contains("locked"))return toast("先に研究で解禁してください");setTool(b.dataset.tool)});
canvas.oncontextmenu=e=>{e.preventDefault();let p=cell(e),i=buildings.findIndex(b=>b.x===p.x&&b.y===p.y);if(i>=0){let b=buildings[i];money+=Math.floor(price[b.type]*.7);if(b.type==="solar")power-=4;buildings.splice(i,1);log(`${typeNames[b.type]}を撤去しました`);update()}};
canvas.onclick=e=>{let p=cell(e);if(p.x<0||p.y<0||p.x>=cols||p.y>=rows)return;let old=at(p.x,p.y);if(tool==="select"){if(old)toast(`${typeNames[old.type]} / ${old.type==="solar"?"電力 +4":"稼働中"}`);return}if(old)return toast("そこには置けません");if(money<price[tool])return toast("資金が足りません");money-=price[tool];buildings.push({x:p.x,y:p.y,type:tool,cool:0});if(tool==="solar")power+=4;log(`${typeNames[tool]}を配置しました`);toast(`${typeNames[tool]}を建設`);update()};
function tick(){sec++;if(sec%45===0)day++;for(const b of buildings){b.cool++;if(b.type==="miner"&&b.cool>=4&&power>=1){ore++;b.cool=0;emit(b.x*C+24,b.y*C+24,"#d7a978")}if(b.type==="furnace"&&b.cool>=5&&ore>0&&power>=2&&(near(b,"miner")||near(b,"belt"))){ore--;plate++;b.cool=0;emit(b.x*C+24,b.y*C+24,"#e3e5e5")}if(b.type==="assembler"&&b.cool>=7&&plate>=2&&power>=3&&(near(b,"furnace")||near(b,"belt"))){plate-=2;gear++;b.cool=0;emit(b.x*C+24,b.y*C+24,"#f3bd4d")}if(b.type==="market"&&b.cool>=9&&gear>0&&near(b,"assembler")){gear--;sold++;money+=20;b.cool=0;emit(b.x*C+24,b.y*C+24,"#73d39a")}}checkMissions();update()}
function checkMissions(){for(const m of missions){if(!finished.has(m.id)&&m.need()>=m.max){finished.add(m.id);money+=m.reward;log(`ミッション達成：${m.title}　報酬 $${m.reward}`);toast(`達成：${m.title}（$${m.reward}）`);if(m.id==="start")unlock(1);if(m.id==="research")unlock(2);if(m.id==="gear")unlock(3)}}}
function unlock(n){document.querySelectorAll(".tool")[n+3]?.classList.remove("locked");if(n===1)$("r2").disabled=false;if(n===2)$("r3").disabled=false}
function update(){ $("money").textContent=money;$("power").textContent=`${power} / 10`;$("day").textContent=day;$("ore").textContent=ore;$("plate").textContent=plate;$("gear").textContent=gear;$("coal").textContent=coal;$("notice").innerHTML=power?`<b>工場は稼働中</b><br>発電機の電力で設備が動いています。`:`<b>電力不足</b><br>発電機を建設してください。`;renderMissions()}
function renderMissions(){let el=$("missions");el.innerHTML="";for(const m of missions){let n=Math.min(m.max,m.need()),done=finished.has(m.id);el.innerHTML+=`<div class="mission ${done?"done":""}"><div class="title"><span>${done?"✓ ":""}${m.title}</span><span>$${m.reward}</span></div><p>${m.desc}</p><div class="bar"><i style="width:${n/m.max*100}%"></i></div><span class="count">${n} / ${m.max}</span></div>`}}
function researchBuy(id,cost,label){if(research>=id)return;if(money<cost)return toast("資金が足りません");money-=cost;research=id;log(`${label}を研究しました`);toast(`${label}を解禁`);if(id===1){document.querySelector('[data-tool="furnace"]').classList.remove("locked");$("r1").disabled=true}if(id===2){document.querySelector('[data-tool="assembler"]').classList.remove("locked");$("r2").disabled=true}if(id===3){document.querySelector('[data-tool="market"]').classList.remove("locked");$("r3").disabled=true}checkMissions();update()}
$("r1").onclick=()=>researchBuy(1,80,"製鉄技術");$("r2").onclick=()=>researchBuy(2,160,"自動組立");$("r3").onclick=()=>researchBuy(3,260,"出荷契約");
function emit(x,y,c){for(let i=0;i<5;i++)particles.push({x,y,c,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.8)*1.5,a:1})}
function draw(){ctx.fillStyle="#182a31";ctx.fillRect(0,0,W,H);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){ctx.fillStyle=(x+y)%2?"#1b3037":"#1d333b";ctx.fillRect(x*C,y*C,C-1,C-1);ctx.strokeStyle="#27444d";ctx.strokeRect(x*C+.5,y*C+.5,C-1,C-1)}for(const b of buildings){let x=b.x*C,y=b.y*C;ctx.fillStyle=color[b.type];ctx.fillRect(x+4,y+4,C-8,C-8);ctx.strokeStyle="#fff6";ctx.strokeRect(x+4.5,y+4.5,C-9,C-9);ctx.font="22px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(icon[b.type],x+24,y+22);ctx.font="8px sans-serif";ctx.fillStyle="#fffc";ctx.fillText(typeNames[b.type],x+24,y+40)}for(const p of particles){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.a-=.025}particles=particles.filter(p=>p.a>0);requestAnimationFrame(draw)}
function loop(t){acc+=t-last;last=t;if(acc>1000){acc-=1000;tick()}requestAnimationFrame(loop)}
log("新しい土地に到着しました。まず発電機と採掘機を置きましょう。");update();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
