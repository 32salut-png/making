<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ちいさな工場 - 開拓編</title>
<style>
:root{--bg:#0d151b;--panel:#17252e;--panel2:#20343f;--line:#355562;--text:#eef5f5;--muted:#9db1b8;--gold:#eab64d;--green:#73d39a;--red:#ed7d70;--blue:#77bdda}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#2c5060,#0d151b 58%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
header{height:70px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;background:#101b22ee;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:20px;letter-spacing:.08em;margin:0}h1 em{color:var(--gold);font-style:normal}.stats{display:flex;gap:18px;color:var(--muted);font-size:12px}.stats b{font-size:16px;color:var(--text);margin-left:4px}.green{color:var(--green)!important}.gold{color:var(--gold)!important}
main{max-width:1420px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:235px minmax(520px,1fr) 300px;gap:16px}.panel{background:linear-gradient(145deg,#1b303a,#15232b);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 32px #0005;overflow:hidden}.panel h2{margin:0;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.13em;color:#bed0d4;text-transform:uppercase}
.tool{width:100%;border:0;border-bottom:1px solid #294650;background:transparent;color:var(--text);padding:11px 13px;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer}.tool:hover{background:#294651}.tool.active{background:#5b4827;box-shadow:inset 4px 0 var(--gold)}.tool.locked{opacity:.42;cursor:not-allowed}.tool .badge{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}.tool small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.hint{padding:13px;color:var(--muted);font-size:11px;line-height:1.65}.hint b{color:var(--text)}
.game{position:relative}.gamebar{height:42px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.gamebar kbd{padding:3px 6px;border:1px solid #4d6974;border-radius:4px;color:var(--text)}canvas{width:100%;display:block;border-top:1px solid var(--line);background:#14242a;image-rendering:auto}.toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:#10232b;border:1px solid #62808a;border-radius:7px;padding:9px 16px;box-shadow:0 7px 22px #0009;font-size:12px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}
.mission{padding:12px;border-bottom:1px solid #2d4954}.mission:last-child{border-bottom:0}.mission .title{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}.mission p{margin:5px 0 7px;color:var(--muted);font-size:10px;line-height:1.4}.mission.done{border-left:3px solid var(--green)}.mission.done .title{color:var(--green)}.bar{height:7px;border-radius:8px;background:#0c151a;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:.25s}.count{display:block;color:var(--muted);font-size:10px;text-align:right;margin-top:3px}
.resources{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:12px}.resource{background:#13212a;border:1px solid #2e4a55;border-radius:7px;padding:8px}.resource label{display:block;font-size:10px;color:var(--muted)}.resource b{display:block;font-size:21px;margin-top:2px}.ore{color:#dfa878}.coal{color:#c3b4dc}.plate{color:#dde4e3}.gear{color:var(--gold)}.notice{margin:0 12px 12px;padding:10px;border-radius:7px;background:#13212a;color:var(--muted);font-size:11px;line-height:1.5}.notice b{color:var(--text)}.research{padding:10px 12px;display:grid;gap:7px}.research button{padding:8px;border:1px solid #41616d;border-radius:6px;background:#203844;color:var(--text);text-align:left;font-size:11px;cursor:pointer}.research button:hover:not(:disabled){background:#2b4d59}.research button:disabled{opacity:.4;cursor:not-allowed}.research small{display:block;color:var(--muted);margin-top:3px}.log{height:120px;overflow:auto;border-top:1px solid var(--line);padding:10px 13px;color:#a8bbc0;font-size:10px;line-height:1.65}.log div:before{content:"› ";color:var(--gold)}
@media(max-width:1080px){main{grid-template-columns:205px minmax(450px,1fr)}main>.panel:last-child{grid-column:1/-1;display:grid;grid-template-columns:1.25fr 1fr}.log{height:110px}}@media(max-width:700px){header{height:auto;align-items:flex-start;gap:8px;flex-direction:column}.stats{gap:9px}main{display:block;margin:8px auto;padding:0 8px}.panel{margin-bottom:9px}.panel:first-child{display:grid;grid-template-columns:1fr 1fr}.panel:first-child h2,.hint{grid-column:1/-1}.gamebar{font-size:10px}}
</style>
</head>
<body>
<header><h1>ちいさな<em>工場</em> <small style="font-size:11px;color:#9db1b8">開拓編</small></h1><div class="stats"><span>資金<b class="green" id="money">180</b></span><span>電力<b id="power">0 / 10</b></span><span>日数<b id="day">1</b></span></div></header>
<main>
<section class="panel"><h2>建設</h2>
<button class="tool active" data-tool="select"><span class="badge" style="background:#526b74">選</span><span>選択<small>設備と地形を確認</small></span></button>
<button class="tool" data-tool="miner"><span class="badge" style="background:#4f8d8d">採</span><span>採掘機　$35<small>鉄鉱石・石炭を掘る</small></span></button>
<button class="tool" data-tool="generator"><span class="badge" style="background:#ad873f">発</span><span>発電機　$35<small>電力を4作る</small></span></button>
<button class="tool" data-tool="belt"><span class="badge" style="background:#527586">運</span><span>ベルト　$8<small>設備を接続する</small></span></button>
<button class="tool locked" data-tool="furnace"><span class="badge" style="background:#ae654d">炉</span><span>溶鉱炉　$55<small>鉄鉱石 → 鉄板</small></span></button>
<button class="tool locked" data-tool="assembler"><span class="badge" style="background:#9872a5">組</span><span>組立機　$85<small>鉄板 → 歯車</small></span></button>
<button class="tool locked" data-tool="market"><span class="badge" style="background:#4d9d75">出</span><span>出荷所　$65<small>歯車を売る</small></span></button>
<div class="hint"><b>最初の手順</b><br>① 発電機を1台置く<br>② 鉄鉱石の上に採掘機を置く<br>③ 右のミッションを上から達成する<br><br><b>接続ルール</b><br>設備はベルトまたは互いの隣に置くと資源を渡します。右クリックで撤去できます。</div></section>
<section class="panel game"><div class="gamebar"><span id="mode">選択モード</span><span><kbd>左クリック</kbd> 建設　<kbd>右クリック</kbd> 撤去</span></div><canvas id="game" width="864" height="576"></canvas><div class="toast" id="toast"></div></section>
<section class="panel"><h2>ミッション</h2><div id="missions"></div><h2>在庫</h2><div class="resources"><div class="resource"><label>鉄鉱石</label><b class="ore" id="ore">0</b></div><div class="resource"><label>石炭</label><b class="coal" id="coal">0</b></div><div class="resource"><label>鉄板</label><b class="plate" id="plate">0</b></div><div class="resource"><label>歯車</label><b class="gear" id="gear">0</b></div></div><div class="notice" id="notice"><b>準備中</b><br>まず発電機と採掘機を建設してください。</div><h2>研究</h2><div class="research"><button id="research1">製鉄技術　$80<small>溶鉱炉を解禁</small></button><button id="research2" disabled>自動組立　$160<small>組立機を解禁</small></button><button id="research3" disabled>出荷契約　$260<small>出荷所を解禁</small></button></div><h2>ログ</h2><div class="log" id="log"></div></section>
</main>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),C=48,cols=18,rows=12,W=864,H=576,$=id=>document.getElementById(id);
const typeNames={miner:"採掘機",generator:"発電機",belt:"ベルト",furnace:"溶鉱炉",assembler:"組立機",market:"出荷所"};
const prices={miner:35,generator:35,belt:8,furnace:55,assembler:85,market:65};
const colors={miner:"#4f8d8d",generator:"#ad873f",belt:"#527586",furnace:"#ae654d",assembler:"#9872a5",market:"#4d9d75"};
let tool="select",money=180,power=0,ore=0,coal=0,plate=0,gear=0,shipped=0,day=1,seconds=0,buildings=[],particles=[],last=performance.now(),acc=0,research=0,done=new Set();
const nodes=[{x:3,y:3,type:"iron"},{x:4,y:3,type:"iron"},{x:13,y:8,type:"coal"},{x:14,y:8,type:"coal"}];
const missions=[
 {id:"start",title:"開拓拠点を作る",desc:"発電機と採掘機を1台ずつ建てる",max:2,reward:50,get:()=>Math.min(1,count("generator"))+Math.min(1,count("miner"))},
 {id:"mine",title:"鉱石を集める",desc:"鉄鉱石を10個ためる",max:10,reward:70,get:()=>ore},
 {id:"research1",title:"製鉄技術を研究する",desc:"右の研究ボタンで製鉄技術を購入する",max:1,reward:100,get:()=>research>=1?1:0},
 {id:"furnace",title:"鉄板を作る",desc:"溶鉱炉を建て、鉄板を5枚作る",max:5,reward:120,get:()=>plate},
 {id:"assembler",title:"自動化ライン",desc:"組立機を建て、歯車を3個作る",max:3,reward:160,get:()=>gear},
 {id:"ship",title:"最初の出荷",desc:"出荷所を建て、歯車を5個出荷する",max:5,reward:250,get:()=>shipped}
];
function count(t){return buildings.filter(b=>b.type===t).length}
function log(s){let e=document.createElement("div");e.textContent=s;$("log").prepend(e);while($("log").children.length>14)$("log").lastChild.remove()}
function toast(s){let e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1500)}
function cell(e){let r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*canvas.width/r.width/C),y:Math.floor((e.clientY-r.top)*canvas.height/r.height/C)}}
function at(x,y){return buildings.find(b=>b.x===x&&b.y===y)}
function nodeAt(x,y){return nodes.find(n=>n.x===x&&n.y===y)}
function near(b,type){return buildings.some(n=>n.type===type&&Math.abs(n.x-b.x)+Math.abs(n.y-b.y)===1)}
function connected(b){return near(b,"belt")||near(b,"miner")||near(b,"furnace")||near(b,"assembler")||near(b,"market")}
function setTool(t){tool=t;document.querySelectorAll(".tool").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));$("mode").textContent=t==="select"?"選択モード":`${typeNames[t]}を配置中`}
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>{if(b.classList.contains("locked"))return toast("先に研究で解禁してください");setTool(b.dataset.tool)});
canvas.oncontextmenu=e=>{e.preventDefault();let p=cell(e),i=buildings.findIndex(b=>b.x===p.x&&b.y===p.y);if(i<0)return;let b=buildings[i];money+=Math.floor(prices[b.type]*.7);if(b.type==="generator")power-=4;buildings.splice(i,1);log(`${typeNames[b.type]}を撤去しました`);update()};
canvas.onclick=e=>{let p=cell(e);if(p.x<0||p.y<0||p.x>=cols||p.y>=rows)return;let old=at(p.x,p.y);if(tool==="select"){if(old)toast(`${typeNames[old.type]} / ${old.type==="generator"?"電力 +4":"稼働中"}`);else if(nodeAt(p.x,p.y))toast(nodeAt(p.x,p.y).type==="iron"?"鉄鉱石の鉱床":"石炭の鉱床");return}if(old)return toast("そこには置けません");if(tool==="miner"&&!nodeAt(p.x,p.y))return toast("採掘機は鉱床の上に置いてください");if(money<prices[tool])return toast("資金が足りません");money-=prices[tool];buildings.push({x:p.x,y:p.y,type:tool,cool:0});if(tool==="generator")power+=4;log(`${typeNames[tool]}を建設しました`);toast(`${typeNames[tool]}を建設`);update()};
function tick(){seconds++;if(seconds%45===0)day++;for(const b of buildings){b.cool++;if(b.type==="miner"&&b.cool>=4&&power>0){let n=nodeAt(b.x,b.y);if(n?.type==="iron")ore++;else if(n?.type==="coal")coal++;b.cool=0;emit(b.x*C+24,b.y*C+24,n?.type==="coal"?"#c3b4dc":"#dfa878")}if(b.type==="furnace"&&b.cool>=5&&ore>0&&power>=2&&connected(b)){ore--;plate++;b.cool=0;emit(b.x*C+24,b.y*C+24,"#e8e8e8")}if(b.type==="assembler"&&b.cool>=7&&plate>=2&&power>=3&&connected(b)){plate-=2;gear++;b.cool=0;emit(b.x*C+24,b.y*C+24,"#eab64d")}if(b.type==="market"&&b.cool>=8&&gear>0&&near(b,"assembler")){gear--;shipped++;money+=20;b.cool=0;emit(b.x*C+24,b.y*C+24,"#73d39a")}}checkMissions();update()}
function checkMissions(){for(const m of missions){if(!done.has(m.id)&&m.get()>=m.max){done.add(m.id);money+=m.reward;log(`達成：${m.title}　報酬 $${m.reward}`);toast(`ミッション達成：${m.title}`);if(m.id==="start")unlockTool("furnace");if(m.id==="research1")$("research2").disabled=false;if(m.id==="assembler")unlockTool("market");}}}
function unlockTool(t){document.querySelector(`[data-tool="${t}"]`).classList.remove("locked")}
function update(){ $("money").textContent=money;$("power").textContent=`${power} / 10`;$("day").textContent=day;$("ore").textContent=ore;$("coal").textContent=coal;$("plate").textContent=plate;$("gear").textContent=gear;$("notice").innerHTML=power?`<b>工場は稼働中</b><br>電力 ${power}。鉱床の上に採掘機を置くと資源が出ます。`:`<b>電力不足</b><br>発電機を建設してください。`;renderMissions()}
function renderMissions(){let el=$("missions");el.innerHTML="";for(const m of missions){let n=Math.min(m.max,m.get()),ok=done.has(m.id);el.innerHTML+=`<div class="mission ${ok?"done":""}"><div class="title"><span>${ok?"✓ ":""}${m.title}</span><span>$${m.reward}</span></div><p>${m.desc}</p><div class="bar"><i style="width:${n/m.max*100}%"></i></div><span class="count">${n} / ${m.max}</span></div>`}}
function buyResearch(id,cost,label,toolName){if(research>=id)return;if(money<cost)return toast("資金が足りません");money-=cost;research=id;log(`${label}を研究しました`);toast(`${label}を解禁`);if(toolName)unlockTool(toolName);if(id===1){$("research1").disabled=true;$("research2").disabled=false}if(id===2){$("research2").disabled=true;$("research3").disabled=false}if(id===3){$("research3").disabled=true;unlockTool("market")}update()}
$("research1").onclick=()=>buyResearch(1,80,"製鉄技術","furnace");$("research2").onclick=()=>buyResearch(2,160,"自動組立","assembler");$("research3").onclick=()=>buyResearch(3,260,"出荷契約","market");
function emit(x,y,c){for(let i=0;i<5;i++)particles.push({x,y,c,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.8)*1.5,a:1})}
function draw(){ctx.fillStyle="#182b31";ctx.fillRect(0,0,W,H);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){ctx.fillStyle=(x+y)%2?"#1b3037":"#1d353c";ctx.fillRect(x*C,y*C,C-1,C-1);ctx.strokeStyle="#2a4750";ctx.strokeRect(x*C+.5,y*C+.5,C-1,C-1)}for(const n of nodes){let x=n.x*C,y=n.y*C;ctx.fillStyle=n.type==="iron"?"#80674f":"#514c67";ctx.beginPath();ctx.arc(x+24,y+25,15,0,Math.PI*2);ctx.fill();ctx.fillStyle="#d8c0a2";ctx.font="bold 13px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(n.type==="iron"?"Fe":"C",x+24,y+25)}for(const b of buildings){let x=b.x*C,y=b.y*C;ctx.fillStyle=colors[b.type];ctx.fillRect(x+5,y+5,C-10,C-10);ctx.strokeStyle="#ffffff66";ctx.lineWidth=2;ctx.strokeRect(x+6,y+6,C-12,C-12);ctx.lineWidth=1;ctx.fillStyle="#fff";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText({miner:"M",generator:"G",belt:"→",furnace:"F",assembler:"A",market:"$"}[b.type],x+24,y+23);ctx.font="8px sans-serif";ctx.fillStyle="#ffffffcc";ctx.fillText(typeNames[b.type],x+24,y+39)}for(const p of particles){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.a-=.025}particles=particles.filter(p=>p.a>0);requestAnimationFrame(draw)}
function loop(t){acc+=t-last;last=t;if(acc>1000){acc-=1000;tick()}requestAnimationFrame(loop)}
log("新しい土地に到着しました。鉱床はFe、石炭はCで表示されます。");update();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
