<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ちいさな工場</title>
<style>
:root{--bg:#101820;--panel:#192733;--panel2:#223746;--line:#355263;--text:#e8f0f2;--muted:#9bb2bb;--accent:#f4b942;--good:#6ed69b;--danger:#ed716b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#26475b,#101820 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{height:68px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2c4655;background:#13222cdd;backdrop-filter:blur(8px)}
h1{font-size:20px;margin:0;letter-spacing:.08em}h1 span{color:var(--accent)}
.stats{display:flex;gap:18px;color:var(--muted);font-size:13px}.stats b{color:var(--text);font-size:16px;margin-left:4px}
main{display:grid;grid-template-columns:230px minmax(540px,1fr) 250px;gap:16px;max-width:1280px;margin:16px auto;padding:0 16px}
.panel{background:linear-gradient(145deg,#1d303d,#172630);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #0003;overflow:hidden}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#aac0c8;padding:14px 15px;margin:0;border-bottom:1px solid var(--line)}
.tool{width:100%;border:0;border-bottom:1px solid #294452;background:transparent;color:var(--text);padding:13px 15px;display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;font:inherit}.tool:hover{background:#2b4654}.tool.active{background:#604d28;box-shadow:inset 4px 0 var(--accent)}.tool:disabled{opacity:.42;cursor:not-allowed}.icon{font-size:22px;width:25px;text-align:center}.tool small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.help{padding:14px;font-size:12px;line-height:1.7;color:var(--muted)}.help strong{color:var(--text)}
.game-wrap{position:relative;min-width:0}.game-head{height:42px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.game-head kbd{padding:3px 7px;border:1px solid #4d6976;border-radius:4px;color:#d9e7ea}
#game{width:100%;display:block;border-top:1px solid var(--line);cursor:crosshair;background:#16232b}
.toast{position:absolute;left:50%;top:55px;transform:translateX(-50%);background:#10232b;box-shadow:0 7px 22px #0008;border:1px solid #55717b;border-radius:7px;padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}
.resources{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:13px}.resource{background:#15232c;border:1px solid #2e4854;border-radius:8px;padding:9px}.resource .label{font-size:11px;color:var(--muted)}.resource b{display:block;font-size:22px;margin-top:2px}.ore{color:#d7a978}.plate{color:#d6dbe0}.gear{color:#f4b942}.money{color:#6ed69b}
.side-note{margin:0 13px 14px;padding:11px;border-radius:8px;background:#15232c;color:var(--muted);font-size:12px;line-height:1.6}.side-note b{color:var(--text)}
.log{height:170px;overflow:auto;padding:12px 14px;font-size:11px;color:#9eb5bd;line-height:1.7;border-top:1px solid var(--line)}.log div::before{content:"› ";color:var(--accent)}
.goal{padding:14px;font-size:12px;color:var(--muted);line-height:1.8}.goal .bar{height:7px;background:#0d171c;border-radius:8px;overflow:hidden;margin-top:5px}.goal .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#61c98e,#f4c458);transition:width .3s}
@media(max-width:980px){main{grid-template-columns:190px minmax(400px,1fr)}main>.panel:last-child{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.log{height:130px}}@media(max-width:680px){header{height:auto;align-items:flex-start;gap:8px;flex-direction:column}.stats{gap:10px}main{display:block;margin:8px auto}.panel{margin-bottom:10px}.game-wrap{overflow:hidden}.game-head{font-size:11px}.game-wrap canvas{min-height:420px;object-fit:cover}.panel:first-child{display:grid;grid-template-columns:1fr 1fr}.panel:first-child h2,.help{grid-column:1/-1}}
</style>
</head>
<body>
<header><h1>ちいさな<span>工場</span></h1><div class="stats"><span>稼働時間<b id="time">00:00</b></span><span>電力<b id="power">100%</b></span><span>資金<b class="money" id="money">120</b>円</span></div></header>
<main>
<section class="panel">
<h2>建設メニュー</h2>
<button class="tool active" data-tool="select"><span class="icon">🖐</span><span>選択<small>建物を確認 / 削除</small></span></button>
<button class="tool" data-tool="miner"><span class="icon">⛏</span><span>採掘機<small>鉄鉱石を掘る　$30</small></span></button>
<button class="tool" data-tool="belt"><span class="icon">➜</span><span>ベルト<small>アイテムを運ぶ　$5</small></span></button>
<button class="tool" data-tool="furnace"><span class="icon">🔥</span><span>溶鉱炉<small>鉄板を作る　$45</small></span></button>
<button class="tool" data-tool="assembler"><span class="icon">⚙</span><span>組立機<small>歯車を作る　$70</small></span></button>
<div class="help"><strong>遊び方</strong><br>建物を選び、マップをクリックして配置します。採掘機 → ベルト → 溶鉱炉 → 組立機をつなぐと自動で生産が始まります。<br><br><strong>ヒント</strong><br>建物は隣接しているとアイテムを渡します。右クリックで撤去できます。</div>
</section>
<section class="panel game-wrap"><div class="game-head"><span id="mode">選択モード</span><span><kbd>左クリック</kbd> 配置　<kbd>右クリック</kbd> 撤去</span></div><canvas id="game" width="720" height="600"></canvas><div class="toast" id="toast"></div></section>
<section class="panel">
<h2>在庫</h2><div class="resources">
<div class="resource"><span class="label">鉄鉱石</span><b class="ore" id="ore">0</b></div><div class="resource"><span class="label">鉄板</span><b class="plate" id="plate">0</b></div><div class="resource"><span class="label">歯車</span><b class="gear" id="gear">0</b></div><div class="resource"><span class="label">売上</span><b class="money" id="sales">0</b></div>
</div><div class="side-note" id="status"><b>工場は停止中</b><br>採掘機を配置すると操業を開始します。</div>
<h2>目標</h2><div class="goal">歯車を10個生産する<div class="bar"><i id="goalbar"></i></div><span id="goaltext">0 / 10</span></div><h2>ログ</h2><div class="log" id="log"></div>
</section>
</main>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),W=720,H=600,C=48,cols=15,rows=12;
const colors={miner:"#4f8d8d",belt:"#527586",furnace:"#ae654d",assembler:"#9872a5"};
let tool="select",money=120,ore=0,plate=0,gear=0,sales=0,elapsed=0,particles=[],buildings=[],last=performance.now(),acc=0;
const names={miner:"採掘機",belt:"ベルト",furnace:"溶鉱炉",assembler:"組立機"};
const prices={miner:30,belt:5,furnace:45,assembler:70};
const $=id=>document.getElementById(id);
function log(s){let e=document.createElement("div");e.textContent=s;$("log").prepend(e);while($("log").children.length>12)$("log").lastChild.remove()}
function toast(s){let e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1500)}
function cellAt(e){let r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*canvas.width/r.width/C),y:Math.floor((e.clientY-r.top)*canvas.height/r.height/C)}}
function at(x,y){return buildings.find(b=>b.x===x&&b.y===y)}
function setTool(t){tool=t;document.querySelectorAll(".tool").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));$("mode").textContent=t==="select"?"選択モード":`${names[t]}を配置中`}
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
canvas.addEventListener("contextmenu",e=>{e.preventDefault();let p=cellAt(e),i=buildings.findIndex(b=>b.x===p.x&&b.y===p.y);if(i>=0){let b=buildings[i];money+=Math.floor(prices[b.type]*.7);buildings.splice(i,1);log(`${names[b.type]}を撤去しました`);toast("撤去しました")}} );
canvas.addEventListener("click",e=>{let p=cellAt(e);if(p.x<0||p.y<0||p.x>=cols||p.y>=rows)return;let old=at(p.x,p.y);if(tool==="select"){if(old)toast(`${names[old.type]}　稼働 ${Math.floor(old.done||0)}%`);return}if(old){toast("そこには置けません");return}if(money<prices[tool]){toast("資金が足りません");return}money-=prices[tool];buildings.push({x:p.x,y:p.y,type:tool,done:0,cool:0});log(`${names[tool]}を配置しました`);toast(`${names[tool]}を建設`);updateUI()});
function neighbor(b,type){return buildings.some(n=>n.type===type&&Math.abs(n.x-b.x)+Math.abs(n.y-b.y)===1)}
function tick(){elapsed++;for(const b of buildings){b.cool=(b.cool||0)+1;if(b.type==="miner"&&b.cool>=3){ore++;b.cool=0;emit(b.x*C+C/2,b.y*C+C/2,"#d7a978");if(ore%5===0)log("採掘機が鉄鉱石を掘り出しました")};if(b.type==="furnace"&&b.cool>=5&&ore>0&&neighbor(b,"miner")||b.type==="furnace"&&b.cool>=5&&ore>0&&neighbor(b,"belt")){ore--;plate++;b.cool=0;emit(b.x*C+C/2,b.y*C+C/2,"#d6dbe0")};if(b.type==="assembler"&&b.cool>=7&&plate>=2&&(neighbor(b,"furnace")||neighbor(b,"belt"))){plate-=2;gear++;sales+=8;b.cool=0;emit(b.x*C+C/2,b.y*C+C/2,"#f4b942");if(gear%5===0)log(`歯車を生産しました（${gear}個）`)}}money+=Math.floor(gear/20);updateUI()}
function emit(x,y,c){for(let i=0;i<5;i++)particles.push({x,y,c,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.8)*1.5,a:1})}
function updateUI(){$("ore").textContent=ore;$("plate").textContent=plate;$("gear").textContent=gear;$("sales").textContent=sales;$("money").textContent=money;$("time").textContent=`${String(Math.floor(elapsed/60)).padStart(2,"0")}:${String(elapsed%60).padStart(2,"0")}`;$("goalbar").style.width=Math.min(100,gear*10)+"%";$("goaltext").textContent=`${Math.min(gear,10)} / 10`;$("status").innerHTML=buildings.length?`<b>工場は稼働中</b><br>${buildings.length}台の設備が稼働しています。`:`<b>工場は停止中</b><br>採掘機を配置すると操業を開始します。`}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#182a31";ctx.fillRect(0,0,W,H);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){ctx.fillStyle=(x+y)%2?"#1b3037":"#1d333b";ctx.fillRect(x*C,y*C,C-1,C-1);ctx.strokeStyle="#27444d";ctx.strokeRect(x*C+.5,y*C+.5,C-1,C-1)}for(const b of buildings){let x=b.x*C,y=b.y*C;ctx.fillStyle=colors[b.type];ctx.fillRect(x+5,y+5,C-10,C-10);ctx.strokeStyle="#ffffff55";ctx.strokeRect(x+5.5,y+5.5,C-11,C-11);ctx.font="22px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText({miner:"⛏",belt:"➜",furnace:"🔥",assembler:"⚙"}[b.type],x+C/2,y+C/2);ctx.font="9px sans-serif";ctx.fillStyle="#ffffffaa";ctx.fillText(names[b.type],x+C/2,y+C-8)}for(const p of particles){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.a-=.025}particles=particles.filter(p=>p.a>0);requestAnimationFrame(draw)}
function loop(t){acc+=t-last;last=t;if(acc>1000){acc-=1000;tick()}requestAnimationFrame(loop)}log("工場へようこそ。まず採掘機を置きましょう。");updateUI();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
