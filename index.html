<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ちいさな工場</title>
<style>
:root{--ink:#dce7e6;--muted:#92a4a4;--gold:#e7b54a;--green:#73cb8e;--red:#e4756b;--steel:#27373a;--steel2:#1d292c;--edge:#536664}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#11191a;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
body{background:radial-gradient(ellipse at 50% -20%,#485b55 0,#202b2b 40%,#101718 78%)}
header{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:linear-gradient(#293536,#1c2829);border-bottom:2px solid #0b1112;box-shadow:0 2px 0 #67716c33;position:sticky;top:0;z-index:5}
h1{font-size:20px;letter-spacing:.08em;margin:0;text-shadow:0 2px #000}h1 i{font-style:normal;color:var(--gold)}.top-stats{display:flex;gap:18px;font-size:12px;color:#b4c1bf}.top-stats strong{display:block;color:#f0f3ed;font-size:16px;text-align:right}.money{color:#8fdb9c!important}
.layout{max-width:1450px;margin:12px auto;padding:0 12px;display:grid;grid-template-columns:220px minmax(600px,1fr) 250px;gap:10px}.panel{background:linear-gradient(180deg,#2c3b3b,#202c2e);border:1px solid #53615d;border-radius:4px;box-shadow:0 5px 16px #0008;overflow:hidden}.panel-title{padding:10px 12px;background:linear-gradient(#354443,#293636);border-bottom:1px solid #0d1415;color:#e3e9e5;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px #000}
.build{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border:0;border-bottom:1px solid #162121;background:linear-gradient(90deg,#263635,#202c2d);color:var(--ink);cursor:pointer;text-align:left}.build:hover{filter:brightness(1.18)}.build.active{background:linear-gradient(90deg,#67522a,#3c392a);box-shadow:inset 4px 0 var(--gold)}.build.locked{opacity:.42;cursor:not-allowed}.build .swatch{width:34px;height:34px;border-radius:5px;border:1px solid #84908a;display:grid;place-items:center;font-weight:900;color:#faf6dd;box-shadow:inset 0 0 0 2px #ffffff18,0 2px #111;position:relative;overflow:hidden}.build .swatch:before,.build .swatch:after{content:"";position:absolute}.build .swatch[data-icon="select"]:before{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:18px solid #f5f0d7;transform:rotate(-32deg);top:7px;left:10px}.build .swatch[data-icon="miner"]:before{width:20px;height:4px;background:#f5f0d7;transform:rotate(-35deg);top:14px;left:7px}.build .swatch[data-icon="miner"]:after{width:7px;height:7px;border:3px solid #f5f0d7;border-radius:50%;top:6px;left:7px}.build .swatch[data-icon="generator"]:before{width:16px;height:16px;border:3px solid #f5f0d7;border-radius:50%;top:6px;left:6px}.build .swatch[data-icon="generator"]:after{width:5px;height:12px;background:#f5f0d7;top:8px;left:14px;transform:rotate(35deg)}.build .swatch[data-icon="belt"]:before{width:21px;height:6px;background:#f5f0d7;top:13px;left:6px;box-shadow:7px 0 #f5f0d7}.build .swatch[data-icon="belt"]:after{width:8px;height:8px;border-top:3px solid #f5f0d7;border-right:3px solid #f5f0d7;transform:rotate(45deg);top:11px;right:5px}.build .swatch[data-icon="furnace"]:before{width:18px;height:15px;background:#f5f0d7;border-radius:2px;top:11px;left:7px}.build .swatch[data-icon="furnace"]:after{width:8px;height:8px;background:#d66b46;border-radius:50%;top:14px;left:13px}.build .swatch[data-icon="assembler"]:before{width:18px;height:18px;border:3px dashed #f5f0d7;border-radius:50%;top:5px;left:5px}.build .swatch[data-icon="assembler"]:after{width:6px;height:6px;background:#f5f0d7;border-radius:50%;top:13px;left:13px}.build .swatch[data-icon="market"]:before{width:22px;height:15px;background:#f5f0d7;top:11px;left:6px;clip-path:polygon(0 25%,100% 25%,88% 100%,12% 100%)}.build .swatch[data-icon="market"]:after{width:24px;height:4px;background:#f5f0d7;top:7px;left:5px}.build b{font-size:12px}.build small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.help{padding:12px;color:#a8b7b3;line-height:1.6;font-size:11px}.help strong{color:#edf1e9}
.world{position:relative;background:#141d1d;border:1px solid #65736e;border-radius:4px;padding:0;overflow:hidden;box-shadow:0 5px 16px #0008}.world-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:linear-gradient(#354443,#293636);border-bottom:1px solid #0d1415;color:#c7d2ce;font-size:11px}.world-head kbd{padding:3px 6px;border:1px solid #71807a;border-radius:3px;color:#f2f4e9}.world canvas{display:block;width:100%;height:auto;cursor:crosshair;image-rendering:auto}.toast{position:absolute;top:48px;left:50%;transform:translateX(-50%);padding:8px 13px;background:#1f2c2d;border:1px solid #81908a;border-radius:4px;box-shadow:0 4px 12px #000c;font-size:12px;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap}.toast.show{opacity:1}.tip{position:absolute;display:none;padding:7px 9px;background:#172122eF;border:1px solid #83908a;border-radius:4px;font-size:11px;pointer-events:none;z-index:2}
.mission{padding:11px;border-bottom:1px solid #172323;background:#263333}.mission.done{border-left:3px solid var(--green)}.mission .line{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.mission.done .line{color:var(--green)}.mission p{margin:5px 0 7px;font-size:10px;color:#a9b8b3}.bar{height:7px;background:#121b1b;border:1px solid #0d1212;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#63b974,#e7b54a);transition:.25s}.count{display:block;text-align:right;color:#9eafaa;font-size:10px;margin-top:3px}.inv{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px}.item{padding:7px;background:#1b2829;border:1px solid #465653;border-radius:3px}.item label{color:#9eafaa;font-size:10px}.item strong{display:block;font-size:19px;color:#f0f3e9}.ore{color:#dfaa75!important}.plate{color:#d7dfdc!important}.gear{color:#e7b54a!important}.coal{color:#b4a1d2!important}.status{margin:0 10px 10px;padding:9px;background:#1b2829;border:1px solid #465653;border-radius:3px;font-size:10px;color:#a9b8b3;line-height:1.5}.status b{color:#edf1e9}.research{padding:9px;display:grid;gap:6px}.research button{padding:8px;text-align:left;background:#2c4140;border:1px solid #60726c;color:#edf1e9;border-radius:3px;cursor:pointer;font-size:11px}.research button:hover:not(:disabled){filter:brightness(1.18)}.research button:disabled{opacity:.4;cursor:not-allowed}.research small{display:block;color:#a9b8b3;font-size:10px;margin-top:2px}.log{height:110px;padding:9px 10px;overflow:auto;border-top:1px solid #152121;color:#aab8b3;font-size:10px;line-height:1.6}.log div:before{content:"› ";color:var(--gold)}
.toolbar{grid-column:2;padding:8px;display:flex;gap:7px;background:linear-gradient(#354443,#293636);border:1px solid #53615d;border-radius:4px;box-shadow:0 4px 12px #0008}.toolbar button{min-width:42px;padding:7px 9px;border:1px solid #687771;border-radius:3px;background:linear-gradient(#52615d,#354241);color:#e8eee8;cursor:pointer;font-size:11px}.toolbar button:hover{filter:brightness(1.2)}.toolbar button.active{background:linear-gradient(#8b6c32,#594a28);border-color:#e7b54a}.toolbar .spacer{flex:1}
@media(max-width:1100px){.layout{grid-template-columns:205px minmax(520px,1fr)}.layout>.panel:last-of-type{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr}.toolbar{grid-column:2}}@media(max-width:700px){header{height:auto;align-items:flex-start;gap:8px;flex-direction:column;padding:10px 12px}.top-stats{gap:10px}.layout{display:block;padding:0 6px;margin:6px auto}.panel,.world,.toolbar{margin-bottom:7px}.layout>.panel:first-child{display:grid;grid-template-columns:1fr 1fr}.layout>.panel:first-child .panel-title,.help{grid-column:1/-1}.toolbar{display:flex;overflow:auto}.world-head{font-size:10px}}
</style>
</head>
<body>
<header><h1>ちいさな<i>工場</i></h1><div class="top-stats"><span>資金<strong class="money" id="money">250</strong></span><span>電力<strong id="power">0 / 12</strong></span><span>稼働日<strong id="day">1</strong></span></div></header>
<div class="layout">
<section class="panel"><div class="panel-title">建設メニュー</div>
<button class="build active" data-tool="select"><span class="swatch" data-icon="select" style="background:#586963"></span><span><b>選択</b><small>設備・鉱床を調べる</small></span></button>
<button class="build" data-tool="miner"><span class="swatch" data-icon="miner" style="background:#497b74"></span><span><b>採掘機　$35</b><small>鉱床から資源を掘る</small></span></button>
<button class="build" data-tool="generator"><span class="swatch" data-icon="generator" style="background:#a67f38"></span><span><b>蒸気発電機　$50</b><small>電力 +4</small></span></button>
<button class="build locked" data-tool="belt"><span class="swatch" data-icon="belt" style="background:#4f6e75"></span><span><b>ベルト　$8</b><small>資源を運ぶ</small></span></button>
<button class="build locked" data-tool="furnace"><span class="swatch" data-icon="furnace" style="background:#9e5745"></span><span><b>石炉　$65</b><small>鉄鉱石 → 鉄板</small></span></button>
<button class="build locked" data-tool="assembler"><span class="swatch" data-icon="assembler" style="background:#765b91"></span><span><b>組立機　$100</b><small>鉄板 → 歯車</small></span></button>
<button class="build locked" data-tool="market"><span class="swatch" data-icon="market" style="background:#437c5f"></span><span><b>出荷所　$75</b><small>歯車を出荷</small></span></button>
<div class="help"><strong>本日の作業</strong><br>マップの銅色の鉱床に採掘機を置き、発電機を隣に置きます。採掘した鉄鉱石はベルトで石炉へ運びます。<br><br><strong>操作</strong><br>左クリック：配置　右クリック：撤去<br>マウスを乗せると建物の情報を表示します。</div></section>
<section class="world"><div class="world-head"><span id="mode">選択モード</span><span><kbd>左クリック</kbd> 建設　<kbd>右クリック</kbd> 撤去</span></div><canvas id="game" width="960" height="600"></canvas><div class="toast" id="toast"></div><div class="tip" id="tip"></div></section>
<section class="panel"><div class="panel-title">作戦目標</div><div id="missions"></div><div class="panel-title">在庫</div><div class="inv"><div class="item"><label>鉄鉱石</label><strong class="ore" id="ore">0</strong></div><div class="item"><label>石炭</label><strong class="coal" id="coal">0</strong></div><div class="item"><label>鉄板</label><strong class="plate" id="plate">0</strong></div><div class="item"><label>歯車</label><strong class="gear" id="gear">0</strong></div></div><div class="status" id="status"><b>電力なし</b><br>蒸気発電機を建設してください。</div><div class="panel-title">研究所</div><div class="research"><button id="r1">基礎物流　$70<small>ベルトを解禁</small></button><button id="r2" disabled>冶金　$120<small>石炉を解禁</small></button><button id="r3" disabled>自動化　$200<small>組立機を解禁</small></button><button id="r4" disabled>出荷契約　$300<small>出荷所を解禁</small></button></div><div class="panel-title">通信ログ</div><div class="log" id="log"></div></section>
<div class="toolbar"><button data-tool="select" class="active">選択</button><button data-tool="rotate">回転</button><button data-tool="demolish">撤去</button><span class="spacer"></span><button id="pause">一時停止</button><button id="reset">新しい工場</button></div>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),T=40,COLS=24,ROWS=15,W=960,H=600,$=id=>document.getElementById(id);
const names={miner:"採掘機",generator:"蒸気発電機",belt:"ベルト",furnace:"石炉",assembler:"組立機",market:"出荷所"};
const prices={miner:35,generator:50,belt:8,furnace:65,assembler:100,market:75};
const colors={miner:"#497b74",generator:"#a67f38",belt:"#4f6e75",furnace:"#9e5745",assembler:"#765b91",market:"#437c5f"};
let tool="select",money=250,power=0,ore=0,coal=0,plate=0,gear=0,shipped=0,day=1,seconds=0,paused=false,rotation=0,buildings=[],particles=[],items=[],last=performance.now(),acc=0,research=0,completed=new Set(),animTime=0;
const deposits=[{x:3,y:4,kind:"iron"},{x:4,y:4,kind:"iron"},{x:4,y:5,kind:"iron"},{x:18,y:10,kind:"coal"},{x:19,y:10,kind:"coal"},{x:19,y:11,kind:"coal"}];
const missions=[{id:"start",title:"電力を確保する",desc:"蒸気発電機を1台建てる",max:1,reward:50,get:()=>count("generator")},{id:"mine",title:"鉄鉱石を採掘する",desc:"鉱床に採掘機を建て、鉄鉱石を10個ためる",max:10,reward:80,get:()=>ore},{id:"logistics",title:"工場をつなぐ",desc:"基礎物流を研究し、ベルトを1本建てる",max:1,reward:100,get:()=>research>=1&&count("belt")?1:0},{id:"smelt",title:"鉄板を作る",desc:"冶金を研究し、石炉で鉄板を5枚作る",max:5,reward:150,get:()=>plate},{id:"automate",title:"歯車を自動化する",desc:"自動化を研究し、歯車を3個作る",max:3,reward:200,get:()=>gear},{id:"ship",title:"最初の出荷",desc:"出荷所から歯車を5個出荷する",max:5,reward:300,get:()=>shipped}];
function count(t){return buildings.filter(b=>b.type===t).length}function deposit(x,y){return deposits.find(d=>d.x===x&&d.y===y)}function at(x,y){return buildings.find(b=>b.x===x&&b.y===y)}function adjacent(b,t){return buildings.some(n=>n.type===t&&Math.abs(n.x-b.x)+Math.abs(n.y-b.y)===1)}function log(s){let e=document.createElement("div");e.textContent=s;$("log").prepend(e);while($("log").children.length>14)$("log").lastChild.remove()}function toast(s){let e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1500)}
function setTool(t){tool=t;document.querySelectorAll(".build,.toolbar button[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));$("mode").textContent=t==="select"?"選択モード":t==="demolish"?"撤去モード":t==="rotate"?"回転モード":`${names[t]||"設備"}を配置中`}
document.querySelectorAll(".build").forEach(b=>b.onclick=()=>{if(b.classList.contains("locked"))return toast("先に研究で解禁してください");setTool(b.dataset.tool)});document.querySelectorAll(".toolbar button[data-tool]").forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function pos(e){let r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*canvas.width/r.width/T),y:Math.floor((e.clientY-r.top)*canvas.height/r.height/T)}}
canvas.oncontextmenu=e=>{e.preventDefault();let p=pos(e),i=buildings.findIndex(b=>b.x===p.x&&b.y===p.y);if(i<0)return;let b=buildings[i];money+=Math.floor(prices[b.type]*.7);if(b.type==="generator")power-=4;buildings.splice(i,1);log(`${names[b.type]}を撤去しました`);update()};
canvas.onclick=e=>{let p=pos(e);if(p.x<0||p.y<0||p.x>=COLS||p.y>=ROWS)return;let old=at(p.x,p.y);if(tool==="select"){if(old)toast(`${names[old.type]} / ${old.type==="generator"?"電力 +4":"稼働中"}`);else if(deposit(p.x,p.y))toast(deposit(p.x,p.y).kind==="iron"?"鉄鉱石の鉱床":"石炭の鉱床");return}if(tool==="demolish"){if(old){money+=Math.floor(prices[old.type]*.7);if(old.type==="generator")power-=4;buildings=buildings.filter(b=>b!==old);update()}return}if(tool==="rotate"){rotation=(rotation+1)%4;toast("向きを変更しました");return}if(old)return toast("そこには置けません");if(tool==="miner"&&!deposit(p.x,p.y))return toast("採掘機は鉱床の上に置いてください");if(money<prices[tool])return toast("資金が足りません");money-=prices[tool];buildings.push({x:p.x,y:p.y,type:tool,dir:rotation,cool:0,run:0});if(tool==="generator")power+=4;log(`${names[tool]}を建設しました`);toast(`${names[tool]}を建設`);update()};
canvas.onmousemove=e=>{let p=pos(e),t=$("tip"),b=at(p.x,p.y),d=deposit(p.x,p.y);if(b){t.style.display="block";t.style.left=(p.x*T+8)+"px";t.style.top=(p.y*T+8)+"px";t.textContent=names[b.type]+"　"+(b.type==="generator"?"発電中":"稼働中")}else if(d){t.style.display="block";t.style.left=(p.x*T+8)+"px";t.style.top=(p.y*T+8)+"px";t.textContent=d.kind==="iron"?"鉄鉱石の鉱床":"石炭の鉱床"}else t.style.display="none"};
function tick(){if(paused)return;seconds++;if(seconds%45===0)day++;for(const b of buildings){b.cool++;b.run=Math.max(0,(b.run||0)-1);if(b.type==="miner"&&b.cool>=4&&power>0){let d=deposit(b.x,b.y);if(d?.kind==="iron")ore++;if(d?.kind==="coal")coal++;b.cool=0;b.run=8;emit(b.x*T+20,b.y*T+20,d?.kind==="coal"?"#bbabd5":"#e0ad76");items.push({x:b.x*T+20,y:b.y*T+20,c:d?.kind==="coal"?"#bbabd5":"#e0ad76",life:1})}if(b.type==="furnace"&&b.cool>=5&&ore>0&&power>=2&&(adjacent(b,"belt")||adjacent(b,"miner"))){ore--;plate++;b.cool=0;b.run=8;emit(b.x*T+20,b.y*T+20,"#f1e7d2")}if(b.type==="assembler"&&b.cool>=7&&plate>=2&&power>=3&&(adjacent(b,"belt")||adjacent(b,"furnace"))){plate-=2;gear++;b.cool=0;b.run=8;emit(b.x*T+20,b.y*T+20,"#e7b54a")}if(b.type==="market"&&b.cool>=8&&gear>0&&adjacent(b,"assembler")){gear--;shipped++;money+=20;b.cool=0;b.run=8;emit(b.x*T+20,b.y*T+20,"#73cb8e")}}checkMissions();update()}
function checkMissions(){for(const m of missions)if(!completed.has(m.id)&&m.get()>=m.max){completed.add(m.id);money+=m.reward;log(`目標達成：${m.title}　報酬 $${m.reward}`);toast(`目標達成：${m.title}`);if(m.id==="start")unlock("belt","r1");if(m.id==="logistics")unlock("furnace","r2");if(m.id==="smelt")unlock("assembler","r3");if(m.id==="automate")unlock("market","r4")}}
function unlock(type,r){document.querySelector(`[data-tool="${type}"]`).classList.remove("locked");$(r).disabled=false}
function buy(id,cost,label,type,r,next){if(research>=id)return;if(money<cost)return toast("資金が足りません");money-=cost;research=id;log(`${label}を研究しました`);toast(`${label}を解禁`);unlock(type,r);if(next)$(next).disabled=false;update()}
document.querySelector("#r1").onclick=()=>buy(1,70,"基礎物流","belt","r1","r2");document.querySelector("#r2").onclick=()=>buy(2,120,"冶金","furnace","r2","r3");document.querySelector("#r3").onclick=()=>buy(3,200,"自動化","assembler","r3","r4");document.querySelector("#r4").onclick=()=>buy(4,300,"出荷契約","market","r4",null);
document.querySelector("#pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"再開":"一時停止";};document.querySelector("#reset").onclick=()=>{if(confirm("工場を初期状態に戻しますか？"))location.reload()};
function update(){$("money").textContent=money;$("power").textContent=`${power} / 12`;$("day").textContent=day;$("ore").textContent=ore;$("coal").textContent=coal;$("plate").textContent=plate;$("gear").textContent=gear;$("status").innerHTML=power?`<b>工場は稼働中</b><br>発電機 ${count("generator")}台 / 電力 ${power}。鉱床上の採掘機が資源を掘っています。`:`<b>工場は停止中</b><br>蒸気発電機を建設してください。`;let el=$("missions");el.innerHTML="";for(const m of missions){let n=Math.min(m.max,m.get()),ok=completed.has(m.id);el.innerHTML+=`<div class="mission ${ok?"done":""}"><div class="line"><span>${ok?"✓ ":""}${m.title}</span><span>$${m.reward}</span></div><p>${m.desc}</p><div class="bar"><i style="width:${n/m.max*100}%"></i></div><span class="count">${n} / ${m.max}</span></div>`}}
function emit(x,y,c){for(let i=0;i<5;i++)particles.push({x,y,c,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.8)*1.5,a:1})}
function terrain(){ctx.fillStyle="#202a28";ctx.fillRect(0,0,W,H);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let v=(x*17+y*31)%5;ctx.fillStyle=v===0?"#3a463d":v===1?"#333e37":"#303b35";ctx.fillRect(x*T,y*T,T-1,T-1);ctx.strokeStyle="#4a5549";ctx.globalAlpha=.16;ctx.strokeRect(x*T+.5,y*T+.5,T-1,T-1);ctx.globalAlpha=1;if(v===0){ctx.fillStyle="#66705f";ctx.globalAlpha=.18;ctx.fillRect(x*T+9,y*T+12,3,2);ctx.fillRect(x*T+28,y*T+28,2,2);ctx.globalAlpha=1}}}
function drawDeposit(d){let x=d.x*T,y=d.y*T;ctx.save();ctx.translate(x+20,y+21);ctx.fillStyle="#17201d";ctx.beginPath();ctx.ellipse(0,7,17,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=d.kind==="iron"?"#71604e":"#4d4865";ctx.beginPath();ctx.moveTo(-17,5);ctx.lineTo(-11,-10);ctx.lineTo(3,-15);ctx.lineTo(16,-7);ctx.lineTo(18,6);ctx.lineTo(6,14);ctx.lineTo(-9,12);ctx.closePath();ctx.fill();ctx.strokeStyle=d.kind==="iron"?"#aa8e70":"#887aa5";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=d.kind==="iron"?"#d1a878":"#b3a5d6";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(d.kind==="iron"?"Fe":"C",0,1);ctx.restore()}
function drawMachine(b){let x=b.x*T,y=b.y*T,active=b.run>0;ctx.save();ctx.translate(x+20,y+20);ctx.fillStyle="#111817";ctx.beginPath();ctx.ellipse(0,18,19,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=colors[b.type];ctx.fillRect(-16,-14,32,31);ctx.fillStyle="#ffffff18";ctx.fillRect(-13,-11,26,4);ctx.strokeStyle="#b9c3b9";ctx.globalAlpha=.65;ctx.strokeRect(-15.5,-13.5,31,30);ctx.globalAlpha=1;
if(b.type==="miner"){ctx.fillStyle="#182522";ctx.fillRect(-9,-5,18,14);ctx.strokeStyle="#d3d9c9";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,-9);ctx.lineTo(5,-16);ctx.lineTo(12,-10);ctx.stroke();ctx.fillStyle="#e2bb68";ctx.beginPath();ctx.arc(0,2,4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#8dd2b2";ctx.fillRect(-12,10,24,3)}
if(b.type==="generator"){ctx.fillStyle="#1d2521";ctx.fillRect(-11,-7,22,18);ctx.fillStyle="#e6bc59";ctx.fillRect(-8,-4,16,5);ctx.fillStyle="#6a4e26";ctx.fillRect(-8,5,5,7);ctx.fillRect(3,5,5,7);ctx.strokeStyle="#e6bc59";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,2,5,0,Math.PI*2);ctx.stroke()}
if(b.type==="furnace"){ctx.fillStyle="#39201b";ctx.fillRect(-11,-5,22,16);ctx.fillStyle=active?"#ffc45c":"#b95d48";ctx.beginPath();ctx.arc(0,4,7,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffd78a";ctx.globalAlpha=active?.8:.25;ctx.beginPath();ctx.arc(Math.sin(animTime/120)*2,-8,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle="#32201b";ctx.fillRect(-14,-12,28,5)}
if(b.type==="assembler"){ctx.fillStyle="#241c2f";ctx.fillRect(-11,-7,22,17);ctx.strokeStyle=active?"#f0c85e":"#d4b5e5";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,2,8,animTime/500,animTime/500+Math.PI*1.55);ctx.stroke();ctx.fillStyle="#e8c35e";ctx.beginPath();ctx.arc(0,2,3,0,Math.PI*2);ctx.fill();ctx.lineWidth=1}
if(b.type==="market"){ctx.fillStyle="#163324";ctx.fillRect(-12,-7,24,17);ctx.fillStyle="#83dfa0";ctx.fillRect(-13,-11,26,5);ctx.fillStyle="#dce8da";ctx.fillRect(-8,2,16,3);ctx.fillStyle="#4a8f64";ctx.fillRect(-5,7,10,3)}
if(active){ctx.strokeStyle="#f2ca63";ctx.globalAlpha=.45+.25*Math.sin(animTime/90);ctx.lineWidth=2;ctx.strokeRect(-19,-18,38,39);ctx.globalAlpha=1}ctx.restore()}
function drawBelt(b){let x=b.x*T+20,y=b.y*T+20,phase=(animTime/180)%1;ctx.fillStyle=colors.belt;ctx.fillRect(x-16,y-16,32,32);ctx.fillStyle="#6d8d91";ctx.fillRect(x-14,y-14,28,28);ctx.strokeStyle="#b9c6bd";ctx.globalAlpha=.55;ctx.strokeRect(x-15.5,y-15.5,31,31);ctx.globalAlpha=1;ctx.fillStyle="#e3c56b";for(let i=0;i<3;i++){let px=x-15+((i+phase)*15)%30;ctx.beginPath();ctx.arc(px,y,3,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#d5e0d6";ctx.globalAlpha=.45;ctx.fillRect(x-14,y-2,28,4);ctx.globalAlpha=1}
function draw(){animTime=performance.now();terrain();for(const d of deposits)drawDeposit(d);for(const b of buildings)if(b.type==="belt")drawBelt(b);for(const b of buildings)if(b.type!=="belt")drawMachine(b);for(const p of particles){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.a-=.025}particles=particles.filter(p=>p.a>0);requestAnimationFrame(draw)}
function loop(t){acc+=t-last;last=t;if(acc>1000){acc-=1000;tick()}requestAnimationFrame(loop)}
log("新しい土地に到着しました。銅色のFe鉱床に採掘機を置いてください。");update();draw();requestAnimationFrame(loop);
</script>
